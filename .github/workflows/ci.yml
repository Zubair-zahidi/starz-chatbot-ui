name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: starz-nexus-backend/package-lock.json
    - name: Install dependencies
      run: cd starz-nexus-backend && npm ci
    - name: Run linting
      run: cd starz-nexus-backend && npm run lint
    - name: Run tests
      run: cd starz-nexus-backend && npm test
    - name: Build
      run: cd starz-nexus-backend && npm run build

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: cd frontend && npm ci
    - name: Run linting
      run: cd frontend && npm run lint
    - name: Run tests
      run: cd frontend && npm test -- --watchAll=false
    - name: Build
      run: cd frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker images
      run: |
        docker-compose build
        docker images